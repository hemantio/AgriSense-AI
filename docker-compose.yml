# ============================================================
# AgriSense AI — Docker Compose
# One-command startup for all services
# ============================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f server # Follow server logs
# ============================================================

services:
  # --- PostgreSQL 16 Database ---
  db:
    image: postgres:16-alpine
    container_name: agrisense-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrisense_db}
      POSTGRES_USER: ${POSTGRES_USER:-agrisense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      # WARNING: Remove or restrict in production — use internal Docker network only
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrisense} -d ${POSTGRES_DB:-agrisense_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis 7 (Cache + Sessions + Task Queue) ---
  redis:
    image: redis:7-alpine
    container_name: agrisense-redis
    restart: unless-stopped
    ports:
      # WARNING: Remove or restrict in production — use internal Docker network only
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-changeme_in_production}

  # --- FastAPI Backend ---
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agrisense-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://agrisense:agrisense_secret@db:5432/agrisense_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- Next.js Frontend ---
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agrisense-client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://server:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local
